# Hermes Dashboard — systemd drop-in override example
#
# Suggested path:
#   /etc/systemd/system/hermes-dashboard.service.d/override.conf
#
# HERMES_TUI_DIR must point to the pre-built TUI directory.
# Without it, the dashboard may try to run npm install on startup.
#
# MemoryDenyWriteExecute=false is required in environments where
# Node.js/V8 JIT needs executable memory permissions. If systemd
# hardening blocks that, the dashboard may crash with:
#
#   V8_Fatal SetPermissionsOnExecutableMemoryChunk

[Service]
Environment=HERMES_TUI_DIR=/opt/hermes-agent/ui-tui
MemoryDenyWriteExecute=false
