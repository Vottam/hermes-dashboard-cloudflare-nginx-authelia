# Hermes Dashboard — systemd drop-in overrides
# Place this file in /etc/systemd/system/hermes-dashboard.service.d/override.conf
# or split into separate .conf files as needed.
#
# IMPORTANT: MemoryDenyWriteExecute=false is required because Node.js/V8 JIT
# needs mprotect(PROT_EXEC) which systemd hardening blocks by default.
# Without this, the dashboard crashes with V8_Fatal SetPermissionsOnExecutableMemoryChunk.
#
# HERMES_TUI_DIR must point to the pre-built TUI directory.
# Without this, the dashboard tries to run npm install on every start, which crashes.

[Service]
Environment=HERMES_TUI_DIR=/opt/hermes-agent/ui-tui
MemoryDenyWriteExecute=false
