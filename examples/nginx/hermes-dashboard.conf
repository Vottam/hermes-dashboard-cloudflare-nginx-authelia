# Hermes Dashboard — Nginx Reverse Proxy Configuration

# Listens on localhost only — not exposed to internet
# All traffic comes from cloudflared via 127.0.0.1

server {
    listen 127.0.0.1:4180;
    server_name hermes-kvm4.example.com;
    server_tokens off;

    # Authelia auth endpoint (internal)
    location /authelia {
        internal;
        proxy_pass http://127.0.0.1:9091/api/authz/auth-request;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL https://hermes-kvm4.example.com$request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Authelia portal — public, no auth_request
    # Authelia serves on /portal subpath
    location /portal {
        proxy_pass http://127.0.0.1:9091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host hermes-kvm4.example.com;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        # Prevent header overflow from long redirect URLs
        proxy_buffer_size 8k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    # WebSocket/API bypass for Hermes Dashboard
    # These endpoints handle their own authentication via tokens
    location ~ ^/api/(ws|events|pty)$ {
        proxy_pass http://127.0.0.1:9119;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;

        # Long timeouts for persistent WebSocket connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        # IMPORTANT: Do not use auth_request here.
        # Authentication is handled by the Hermes Dashboard token/ticket.
    }

    # Main location — requires Authelia auth
    location / {
        auth_request /authelia;

        # On 401, redirect to Authelia portal
        # Use https:// fixed (NOT $scheme) because Nginx receives HTTP from cloudflared
        auth_request_set $auth_redirect $upstream_http_location;
        error_page 401 =302 https://hermes-kvm4.example.com/portal/?rd=https://hermes-kvm4.example.com$request_uri;

        # Pass user info from Authelia to dashboard
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        auth_request_set $name $upstream_http_remote_name;
        auth_request_set $email $upstream_http_remote_email;

        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Groups $groups;
        proxy_set_header Remote-Name $name;
        proxy_set_header Remote-Email $email;

        # Proxy to Hermes Dashboard
        proxy_pass http://127.0.0.1:9119;
        proxy_set_header Host 127.0.0.1:9119;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host hermes-kvm4.example.com;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "";

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Prevent header overflow
        proxy_buffer_size 8k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
}
