# Hermes Dashboard — Nginx reverse proxy example
#
# Public path:
#   Browser -> Cloudflare -> cloudflared -> 127.0.0.1:4180 -> Nginx
#
# Local backends:
#   Hermes Dashboard: 127.0.0.1:9119
#   Authelia:         127.0.0.1:9091
#
# This is a sanitized example. Replace hermes-kvm4.example.com
# with your own hostname.

server {
    listen 127.0.0.1:4180;
    server_name hermes-kvm4.example.com;

    server_tokens off;

    # Authelia auth_request endpoint.
    # This location is internal and is called by Nginx only.
    location = /authelia-auth {
        internal;

        proxy_pass http://127.0.0.1:9091/api/authz/auth-request;
        proxy_pass_request_body off;

        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL https://hermes-kvm4.example.com$request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host hermes-kvm4.example.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Authelia portal.
    # This must remain reachable without auth_request,
    # otherwise authentication will loop.
    location /portal {
        proxy_pass http://127.0.0.1:9091;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host hermes-kvm4.example.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_buffer_size 8k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    # Hermes WebSocket endpoints.
    #
    # These paths must preserve Upgrade/Connection headers.
    # Do not force Authelia auth_request here unless your dashboard
    # WebSocket authentication model supports it.
    location ~ ^/api/(ws|events|pty)$ {
        proxy_pass http://127.0.0.1:9119;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Main dashboard.
    location / {
        auth_request /authelia-auth;

        error_page 401 =302 https://hermes-kvm4.example.com/portal/?rd=https://hermes-kvm4.example.com$request_uri;

        auth_request_set $user   $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        auth_request_set $name   $upstream_http_remote_name;
        auth_request_set $email  $upstream_http_remote_email;

        proxy_set_header Remote-User   $user;
        proxy_set_header Remote-Groups $groups;
        proxy_set_header Remote-Name   $name;
        proxy_set_header Remote-Email  $email;

        proxy_pass http://127.0.0.1:9119;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host hermes-kvm4.example.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # Avoid forwarding browser Authorization headers to the dashboard.
        proxy_set_header Authorization "";

        # Safe for endpoints that upgrade under the main location.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffer_size 8k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
}
